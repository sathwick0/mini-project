{% extends "base.html" %}
{% block body %}
<!-- login card centered on page -->
<div class="d-flex justify-content-center align-items-center" style="min-height:85vh">
  <div class="card shadow" style="width:360px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div style="font-size:2rem">🛡</div>
        <div class="fw-bold" style="color:#e6edf3">SmartScaleGuard</div>
        <div style="font-size:.75rem; color:#8b949e">Admin Access</div>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label" style="font-size:.8rem; color:#8b949e">Username</label>
          <input name="username" type="text" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" style="font-size:.8rem; color:#8b949e">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <!-- show error if credentials wrong -->
        {% if error %}
          <div class="alert alert-danger py-2" style="font-size:.82rem">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
